<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <form action="/predict" method="POST">
        <h2>🌱 Crop Recommendation</h2>

        <input type="number" name="n" placeholder="Nitrogen (0-150)" min="0" max="150" required>

<input type="number" name="p" placeholder="Phosphorus (0-150)" min="0" max="150" required>

<input type="number" name="k" placeholder="Potassium (0-150)" min="0" max="150" required>

<input type="number" name="temperature" placeholder="Temperature (0-50°C)" min="0" max="50" step="0.1" required>

<input type="number" name="humidity" placeholder="Humidity (0-100%)" min="0" max="100" step="0.1" required>

<input type="number" name="ph" placeholder="pH (0-14)" min="0" max="14" step="0.1" required>

<input type="number" name="rainfall" placeholder="Rainfall (0-300 mm)" min="0" max="300" step="0.1" required>  

        <button type="submit">Predict</button>
    </form>
</div>

</body>
</html>
